<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />

  <g fill="#c7d2fe" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="48" y="72" font-size="26" font-weight="700" fill="#e0e7ff">chat-service</text>
    <text x="48" y="104" font-size="17" fill="#a5b4fc">Golang · WebSocket · Gemini function calling</text>
  </g>

  <g>
    <rect x="48" y="150" width="330" height="72" rx="18" fill="#312e81" />
    <text x="72" y="182" font-size="16" fill="#e0e7ff" font-family="ui-sans-serif, system-ui, sans-serif">
      Còn laptop gaming dưới 20 triệu không?
    </text>
    <text x="72" y="206" font-size="13" fill="#a5b4fc" font-family="ui-sans-serif, system-ui, sans-serif">
      người dùng
    </text>
  </g>

  <g>
    <rect x="240" y="248" width="512" height="96" rx="18" fill="#4f46e5" />
    <text x="264" y="282" font-size="16" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif">
      Bot gọi tool search_products(query, maxPrice) rồi trả lời
    </text>
    <text x="264" y="308" font-size="16" fill="#e0e7ff" font-family="ui-sans-serif, system-ui, sans-serif">
      kèm 3 sản phẩm khớp ngân sách.
    </text>
    <text x="264" y="330" font-size="13" fill="#c7d2fe" font-family="ui-sans-serif, system-ui, sans-serif">
      chatbot
    </text>
  </g>

  <g font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#818cf8">
    <rect x="48" y="386" width="704" height="66" rx="14" fill="#1e293b" />
    <text x="72" y="416">user → chat-service → search_products() → search-service</text>
    <text x="72" y="438">search-service → ranked ids → Gemini → câu trả lời có dẫn nguồn</text>
  </g>
</svg>
